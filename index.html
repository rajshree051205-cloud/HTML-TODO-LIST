
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

<title>Advanced Todo List</title>

<style>
body {
    background: linear-gradient(135deg, #0f172a, #1e293b);
    font-family: 'Segoe UI', sans-serif;
    color: #fff;
    min-height: 100vh;
}

.navbar {
    background: rgba(255,255,255,0.08) !important;
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.1);
}

.btn-primary {
    background: linear-gradient(45deg, #6366f1, #3b82f6);
    border: none;
    border-radius: 12px;
    transition: 0.3s;
    box-shadow: 0 10px 25px rgba(59,130,246,0.3);
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 30px rgba(59,130,246,0.5);
}

.table {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    border-radius: 15px;
    overflow: hidden;
}

.table thead {
    background: rgba(255,255,255,0.1);
}

.table td, .table th {
    color: #e2e8f0;
    border-color: rgba(255,255,255,0.1) !important;
}

tbody tr {
    transition: 0.3s;
}

tbody tr:hover {
    background: rgba(255,255,255,0.08);
    transform: scale(1.01);
}

.bi {
    cursor: pointer;
    transition: 0.3s;
    font-size: 1.2rem;
}

.bi:hover {
    transform: scale(1.3);
}

.modal-content {
    background: rgba(15,23,42,0.95);
    backdrop-filter: blur(15px);
    color: white;
    border-radius: 15px;
    border: 1px solid rgba(255,255,255,0.1);
}

.modal-header, .modal-footer {
    border: none;
}

.form-control {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    color: white;
    border-radius: 10px;
}

.form-control:focus {
    background: rgba(255,255,255,0.12);
    border-color: #3b82f6;
    box-shadow: none;
    color: white;
}

.text-muted {
    color: #94a3b8 !important;
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(10px);}
    to {opacity: 1; transform: translateY(0);}
}

tbody tr {
    animation: fadeIn 0.3s ease-in;
}
</style>

</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container-fluid">
        <span class="navbar-brand font-weight-bold">TODO PRO</span>
    </div>
</nav>

<div class="container mt-4">

    <button class="btn btn-primary mb-3" onclick="showAddTaskModal()">
        + Add Task
    </button>

    <table class="table text-center">
        <thead>
            <tr>
                <th>#</th>
                <th>Task</th>
                <th>Responsible</th>
                <th>ETA</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="taskTableBody">
            <tr>
                <td colspan="5" class="text-muted">No Tasks Added yet</td>
            </tr>
        </tbody>
    </table>
</div>

<div class="modal fade" id="addTaskModal">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5>Add Task</h5>
                <button class="close text-white" data-dismiss="modal">&times;</button>
            </div>

            <div class="modal-body">
                <form id="addTaskForm">
                    <input class="form-control mb-2" name="taskDescription" placeholder="Task">
                    <input class="form-control mb-2" name="taskResponsiblePerson" placeholder="Responsible">
                    <input class="form-control" type="date" name="taskETA">
                </form>
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                <button class="btn btn-primary" onclick="addTask()">Save</button>
            </div>

        </div>
    </div>
</div>

<div class="modal fade" id="updateTaskModal">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5>Edit Task</h5>
                <button class="close text-white" data-dismiss="modal">&times;</button>
            </div>

            <div class="modal-body">
                <form id="taskUpdateForm">
                    <textarea class="form-control mb-2" name="taskDescription"></textarea>
                    <input class="form-control mb-2" name="taskResponsiblePerson">
                    <input class="form-control" type="date" name="taskETA">
                    <input type="hidden" id="editIndex" name="editIndex">
                </form>
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                <button class="btn btn-primary" onclick="updateTask()">Update</button>
            </div>

        </div>
    </div>
</div>

<!-- JS -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>

<script>

createHtmlFromStorage();

function showAddTaskModal(){
    $('#addTaskModal').modal('show');
}

function addTask(){
    $('#addTaskModal').modal('hide');

    let dataArr = $('#addTaskForm').serializeArray();
    let taskObject = {};
    let storage = localStorage.getItem('taskStorage');
    let arr = storage ? JSON.parse(storage) : [];

    for(let i in dataArr){
        taskObject[dataArr[i].name] = dataArr[i].value;
    }

    arr.push(taskObject);
    localStorage.setItem('taskStorage', JSON.stringify(arr));

    $('#addTaskForm').trigger('reset');
    createHtmlFromStorage();
}


function createHtmlFromStorage(){
    let storage = localStorage.getItem('taskStorage');
    let arr = storage ? JSON.parse(storage) : [];

    if(arr.length === 0){
        $('#taskTableBody').html(
            `<tr><td colspan="5" class="text-muted">No Tasks Added yet</td></tr>`
        );
        return;
    }

    let html = '';

    arr.forEach((task, i) => {
        html += `
        <tr>
            <td>${i+1}</td>
            <td>${task.taskDescription}</td>
            <td>${task.taskResponsiblePerson}</td>
            <td>${task.taskETA}</td>
            <td>
                <i class="bi bi-check-circle-fill text-success mr-2" onclick="completeTask(${i})"></i>
                <i class="bi bi-pencil-square text-primary mr-2" onclick="editTask(${i})"></i>
                <i class="bi bi-trash-fill text-danger" onclick="deleteTask(${i})"></i>
            </td>
        </tr>`;
    });

    $('#taskTableBody').html(html);
}


function editTask(index){
    let arr = JSON.parse(localStorage.getItem('taskStorage'));

    $('textarea[name="taskDescription"]').val(arr[index].taskDescription);
    $('input[name="taskResponsiblePerson"]').val(arr[index].taskResponsiblePerson);
    $('input[name="taskETA"]').val(arr[index].taskETA);

    $('#editIndex').val(index);
    $('#updateTaskModal').modal('show');
}


function updateTask(){
    let dataArr = $('#taskUpdateForm').serializeArray();
    let obj = {};
    let arr = JSON.parse(localStorage.getItem('taskStorage'));

    dataArr.forEach(item => obj[item.name] = item.value);

    arr[obj.editIndex] = obj;

    localStorage.setItem('taskStorage', JSON.stringify(arr));
    $('#updateTaskModal').modal('hide');

    createHtmlFromStorage();
}


function deleteTask(index){
    if(confirm("Delete this task?")){
        let arr = JSON.parse(localStorage.getItem('taskStorage'));
        arr.splice(index, 1);

        localStorage.setItem('taskStorage', JSON.stringify(arr));
        createHtmlFromStorage();
    }
}


function completeTask(index){
    let arr = JSON.parse(localStorage.getItem('taskStorage'));
    arr[index].completed = true;

    localStorage.setItem('taskStorage', JSON.stringify(arr));
    createHtmlFromStorage();
}

</script>

</body>
</html>
