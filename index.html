<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>HTML Todo List</title>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a href="#" class="navbar-brand">
            <img src="logo.png" class="img-fluid" alt="logo" width="150">
        </a>
        <button type="button" class="navbar-toggler" data-toggle="collapse" data-target="#navbarNav">
            <i class="bi bi-list"></i>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav"></div>
    </div>
</nav>

<div class="container mt-4">
    <button type="button" class="btn btn-primary mb-3" onclick="showAddTaskModal()">Add Task</button>

    <table class="table table-bordered text-center">
        <thead>
            <tr>
                <th>#</th>
                <th>Task/Description</th>
                <th>Responsible</th>
                <th>ETA</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="taskTableBody">
            <tr id="noTaskRow">
                <td colspan="5" class="text-center text-muted">No Tasks Added yet</td>
            </tr>
        </tbody>
    </table>
</div>

<div class="modal fade" id="addTaskModal" data-backdrop="static" data-keyboard="false" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add Task</h5>
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
            </div>
            <div class="modal-body">
                <form id="addTaskForm">
                    <div class="form-group">
                        <label>Task Description</label>
                        <input type="text" class="form-control" name="taskDescription" placeholder="Enter task">
                    </div>
                    <div class="form-group">
                        <label>Responsible Person</label>
                        <input type="text" class="form-control" name="taskResponsiblePerson" placeholder="Responsible person">
                    </div>
                    <div class="form-group">
                        <label>ETA</label>
                        <input type="date" class="form-control" name="taskETA">
                    </div>
                    <input type="hidden" name="taskIndex" id="taskIndex" value="-1">
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="addTask()">Add Task</button>
            </div>
        </div>
    </div>
</div>


<div class="modal fade" id="updateTaskModal" data-backdrop="static" data-keyboard="false" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit Task</h5>
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
            </div>
            <div class="modal-body">
                <form id="taskUpdateForm">
                    <div class="form-group">
                        <label>Task Description</label>
                        <textarea class="form-control" name="taskDescription" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Responsible Person</label>
                        <input type="text" class="form-control" name="taskResponsiblePerson">
                    </div>
                    <div class="form-group">
                        <label>ETA</label>
                        <input type="date" class="form-control" name="taskETA">
                    </div>
                    <input type="hidden" name="editIndex" id="editIndex">
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="updateTask()">Update Task</button>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>

<script>
    
    createHtmlFromStorage();

    function showAddTaskModal() {
        $('#addTaskModal').modal('show');
    }

    function addTask() {
        console.log('Add Task clicked');
        $('#addTaskModal').modal('hide');

        var dataArr = $('#addTaskForm').serializeArray();
        var taskObject = new Object();
        var storageObjectArr = [];
        var storageObject = localStorage.getItem('taskStorage');

        for (var i in dataArr) {
            var name = dataArr[i]['name'];
            var value = dataArr[i]['value'];
            taskObject[name] = value;
        }

        if (storageObject != null && storageObject != undefined && storageObject != '') {
            storageObjectArr = JSON.parse(storageObject);
            storageObjectArr.push(taskObject);
        } else {
            storageObjectArr.push(taskObject);
        }

        localStorage.setItem('taskStorage', JSON.stringify(storageObjectArr));
        createHtmlFromStorage();
        $('#addTaskForm').trigger('reset');
    }

    function createHtmlFromStorage() {
        var storageObjectArr = [];
        var storageObject = localStorage.getItem('taskStorage');
        storageObjectArr = JSON.parse(storageObject);
        console.log(storageObjectArr);

        if (storageObject != null && storageObject != undefined && storageObject != '') {
            storageObjectArr = JSON.parse(storageObject);
            var html = '';
            for (var i in storageObjectArr) {
                html += '<tr>' +
                    '<td>' + (parseInt(i) + 1) + '</td>' +
                    '<td>' + storageObjectArr[i]['taskDescription'] + '</td>' +
                    '<td>' + storageObjectArr[i]['taskResponsiblePerson'] + '</td>' +
                    '<td>' + storageObjectArr[i]['taskETA'] + '</td>' +
                    '<td>' +
                        '<i class="bi bi-check-circle-fill text-success mr-2" style="cursor:pointer;font-size:1.2rem" onclick="completeTask(' + i + ')"></i>' +
                        '<i class="bi bi-pencil-square text-primary mr-2" style="cursor:pointer;font-size:1.2rem" onclick="editTask(' + i + ')"></i>' +
                        '<i class="bi bi-trash-fill text-danger" style="cursor:pointer;font-size:1.2rem" onclick="deleteTask(' + i + ')"></i>' +
                    '</td>' +
                '</tr>';
            }
            $('#taskTableBody').html(html);
        } else {
            $('#taskTableBody').html('<tr><td colspan="5" class="text-center text-muted">No Tasks Added yet</td></tr>');
        }
    }

    function editTask(index) {
        var storageObject = localStorage.getItem('taskStorage');
        var storageObjectArr = JSON.parse(storageObject);

        $('textarea[name="taskDescription"]').val(storageObjectArr[index]['taskDescription']);
        $('input[name="taskResponsiblePerson"]').val(storageObjectArr[index]['taskResponsiblePerson']);
        $('input[name="taskETA"]').val(storageObjectArr[index]['taskETA']);
        $('#editIndex').val(index);
        $('#updateTaskModal').modal('show');
    }

    function updateTask() {
        var dataArr = $('#taskUpdateForm').serializeArray();
        var taskObject = new Object();
        var storageObjectArr = [];
        var storageObject = localStorage.getItem('taskStorage');

        for (var i in dataArr) {
            var name = dataArr[i]['name'];
            var value = dataArr[i]['value'];
            taskObject[name] = value;
        }

        if (storageObject != null && storageObject != undefined && storageObject != '') {
            storageObjectArr = JSON.parse(storageObject);
            storageObjectArr[taskObject['editIndex']] = taskObject;
        }

        localStorage.setItem('taskStorage', JSON.stringify(storageObjectArr));
        createHtmlFromStorage();
        $('#updateTaskModal').modal('hide');
    }

    function deleteTask(index) {
        if (confirm('Delete this task?')) {
            var storageObject = localStorage.getItem('taskStorage');
            var storageObjectArr = JSON.parse(storageObject);
            storageObjectArr.splice(index, 1);
            localStorage.setItem('taskStorage', JSON.stringify(storageObjectArr));
            createHtmlFromStorage();
        }
    }

    function completeTask(index) {
        var storageObject = localStorage.getItem('taskStorage');
        var storageObjectArr = JSON.parse(storageObject);
        storageObjectArr[index]['completed'] = true;
        localStorage.setItem('taskStorage', JSON.stringify(storageObjectArr));
        createHtmlFromStorage();
    }
</script>

</body>
</html>
